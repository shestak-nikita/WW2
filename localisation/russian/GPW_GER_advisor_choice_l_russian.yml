l_russian:
 GER_GPW_Albert_Shpeer:0 "Альберт Шпеер"
 GER_GPW_Albert_Shpeer_desc:0 "Фокус открывает Альберта Шпеера как экономического советника. Он виден с начала игры и может быть назначен после завершения фокуса, если место экономического советника не занято другим советником с взаимоисключением."
 GER_GPW_Yarmal_Shaht:0 "Ярмал Шахт"
GER_GPW_Yarmal_Shaht_desc:0 "Завершение фокуса открывает Ярмала Шахта как экономического советника. Он виден с начала игры; только один из советников — Шахт, Функ, Шпеер или Геринг — может занимать исключительное место экономического советника."
 GER_GPW_Walther_Funk:0 "Вальтер Функ"
GER_GPW_Walther_Funk_desc:0 "Завершение фокуса открывает Вальтера Функа как экономического советника. Он виден с начала игры; только один из советников — Шахт, Функ, Шпеер или Геринг — может занимать исключительное место экономического советника."
 GPW_GER_speer_economic_advisor:0 "Организатор промышленности"
 GPW_GER_speer_economic_advisor_desc:0 "Увеличивает скорость строительства военных заводов на 15% и снижает стоимость производства пехотного снаряжения третьего уровня на 5%."

GER_the_four_year_plan_desc:0 "Четырёхлетний план расширяет немецкую промышленность, даёт одноразовый бонус к исследованиям отрасли и открывает Германа Геринга как экономического советника. Его можно назначить после фокуса, если исключительное место не занято Шахтом, Функом или Шпеером."
GPW_GER_advisor_unlocked_tt:0 "§YСоветник открыт:§! он виден с начала игры и может быть назначен после этого фокуса, если исключительное место экономического советника свободно."

