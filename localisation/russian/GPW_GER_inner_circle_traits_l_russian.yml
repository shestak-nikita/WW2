l_russian:
 GPW_GER_SPEER_STAGE_2:0 "Архитектор Рейха II"
 GPW_GER_SPEER_STAGE_2_desc:0 "Шпеер получает общий бонус +10% к скорости строительства и расходует -0,20 политической власти в день."
 GPW_GER_SPEER_STAGE_3:0 "Архитектор Рейха III"
 GPW_GER_SPEER_STAGE_3_desc:0 "Шпеер получает общий бонус +15% к скорости строительства и расходует -0,40 политической власти в день."
 GPW_GER_SPEER_WUNDERWAFFE:0 "Специалист по улучшенному пехотному снаряжению"
 GPW_GER_SPEER_WUNDERWAFFE_desc:0 "Снижает стоимость производства улучшенного пехотного снаряжения на 10%."
 GER_wunderwaffe_speer_infantry_equipment:0 "Экспертиза Альберта Шпеера"
 GER_ascension_of_speer_desc:0 "Шпеер получает бонусы черты «Архитектор Рейха», пока остаётся во Внутреннем круге. Его личные фокусы усиливают эти бонусы. Если исключить Шпеера из круга, он потеряет все полученные в нём ступени и вернётся к базовой черте: +5% к скорости строительства и расход 0,10 политической власти в день."
 GER_employ_philipp_holzmann_desc:0 "Этот фокус даёт Шпееру вторую ступень черты «Архитектор Рейха», пока он остаётся во Внутреннем круге: +10% к скорости строительства и расход 0,20 политической власти в день. Существующие строительные награды сохраняются."
 GER_plenipotentiary_of_armaments_desc:0 "Этот фокус даёт Шпееру третью ступень черты «Архитектор Рейха», пока он остаётся во Внутреннем круге: +15% к скорости строительства и расход 0,40 политической власти в день. Существующие промышленные награды сохраняются."
 GPW_GER_speer_circle_progression_tt:0 "Альберт Шпеер получает бонусы черты «Архитектор Рейха», пока остаётся во Внутреннем круге. Его личные фокусы усиливают эти бонусы. При исключении из круга он потеряет все полученные ступени и вернётся к базовой черте: +5% к скорости строительства и расход 0,10 политической власти в день."
 GER_inner_circle_industrial_me_focuses_tt:0 "(Этот фокус не блокирует другие промышленные ветки Внутреннего круга: §Y$FOCUS_1$§! и §Y$FOCUS_2$§!.)"
 GPW_GER_IC_GORING_1:0 "Руководитель Четырёхлетнего плана I"
 GPW_GER_IC_GORING_1_desc:0 "Улучшенная черта политического советника Германа Геринга."
 GPW_GER_IC_GORING_2:0 "Руководитель Четырёхлетнего плана II"
 GPW_GER_IC_GORING_2_desc:0 "Улучшенная черта политического советника Германа Геринга."
 GER_organization_todt_stage_1_trait:0 "$construction_company$"
