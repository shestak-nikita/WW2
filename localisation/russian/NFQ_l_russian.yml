 NFQ_start_text:0 "Мод позволяет заранее добавлять национальные фокусы в очередь. После завершения текущего фокуса игра автоматически выберет следующий доступный элемент."
 NFQ_start_text_error:0 "Спасибо за использование §YNational Focus Queuer§!!§W\n\n§RВнимание:§W поддерживаются следующие страны: §YСССР, Германия, Япония, США, Великобритания, Франция, Италия и Индия (при наличии DLC Graveyard of Empires)§W."
 NFQ_start_title_1:0 "Как добавить фокусы в очередь?"
 NFQ_start_desc_1:0 "§GДобавление фокусов:§W\n- Нажмите §Yжёлтый шарик§W рядом с фокусом, чтобы добавить его в очередь.\n- Номер показывает позицию; повторный щелчок удаляет фокус.\n- Очередь запускается автоматически после снятия паузы.\n\n§GОжидание:§W\n- Кнопками §Y+§W и §Y-§W задайте длительность.\n- Нажмите §Y?§W, чтобы добавить ожидание; пока оно идёт, новый фокус не запускается.\n\n§RОграничения:§W Работают только деревья, подключённые к NFQ."
 NFQ_start_title_2:0 "Как просматривать очередь?"
 NFQ_start_desc_2:0 "Нажмите кнопку в §Yправом верхнем углу§W окна национальных фокусов, чтобы открыть менеджер.\n\nВ менеджере можно:\n- Просматривать фокусы и ожидания в очереди;\n- Менять порядок стрелками;\n- Удалять отдельные элементы или очищать всю очередь;\n- Пропускать недоступный элемент после ошибки."
 NFQ_letter:0 "Планируйте дерево фокусов заранее и экономьте время на микроменеджменте!"
 NFQ_start_close:0 "Закрыть"
