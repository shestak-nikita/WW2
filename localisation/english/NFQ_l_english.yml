 NFQ_OpenButton:0 "Open the National Focus Queuer"
 NFQ_start_text:0 "This mod allows you to queue up national focuses, similar to how MIO traits can be queued. Plan your focus path in advance and let the game automatically select the next focus when one completes!"
 NFQ_start_text_error:0 "Thank you for using the §YNational Focus Queuer§!!§W\n\n§RNote:§W Currently supported: §YSoviet Union, German Reich, Japan, USA, UK, France, Italy, and India (with Graveyard of Empires DLC)§W."
 NFQ_start_title_1:0 "How do I add focuses to the queue?"
 NFQ_start_desc_1:0 "§GAdding focuses:§W\n- Click the §Ygold orb§W beside a focus to queue it.\n- The number shows its queue position; click again to remove it.\n- The queue starts automatically when unpaused.\n\n§GHold periods:§W\n- Use §Y+§W and §Y-§W to set the number of days.\n- Click §Y?§W to queue the hold. No focus starts while it runs.\n\n§RLimitations:§W Only focus trees supported by NFQ are covered."
 NFQ_start_title_2:0 "How do I view and manage the queue?"
 NFQ_start_desc_2:0 "Click the button in the §Ytop-right corner§W (the sheet with a §Y#§W symbol) to open the Queue Manager.\n\nIn the manager you can:\n- View all queued focuses and actions;\n- Reorder items using the arrow buttons;\n- Remove individual items or clear the entire queue;\n- Skip the blocked item after an error."
 NFQ_letter:0 "Plan your focus tree in advance and spend less time on micromanagement!"
