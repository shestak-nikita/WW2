l_english:
 GPW_GER_SPEER_STAGE_2:0 "Reich Architect II"
 GPW_GER_SPEER_STAGE_2_desc:0 "Albert Speer gains a total construction speed bonus of 10% and costs 0.20 political power per day."
 GPW_GER_SPEER_STAGE_3:0 "Reich Architect III"
 GPW_GER_SPEER_STAGE_3_desc:0 "Albert Speer gains a total construction speed bonus of 15% and costs 0.40 political power per day."
 GPW_GER_SPEER_WUNDERWAFFE:0 "Improved Infantry Equipment Specialist"
 GPW_GER_SPEER_WUNDERWAFFE_desc:0 "Reduces the production cost of improved infantry equipment by 10%."
 GER_wunderwaffe_speer_infantry_equipment:0 "Albert Speer's Expertise"
 GER_ascension_of_speer_desc:0 "Speer gains the Reich Architect bonuses while he remains in the Inner Circle. His personal focuses strengthen these bonuses. If he is removed from the circle, he loses every stage earned through it and returns to the base trait: +5% construction speed at a cost of 0.10 political power per day."
 GER_employ_philipp_holzmann_desc:0 "This focus grants Speer the second Reich Architect stage while he remains in the Inner Circle: +10% construction speed and a cost of 0.20 political power per day. His existing construction rewards are preserved."
 GER_plenipotentiary_of_armaments_desc:0 "This focus grants Speer the third Reich Architect stage while he remains in the Inner Circle: +15% construction speed and a cost of 0.40 political power per day. Its existing industrial rewards are preserved."
 GPW_GER_speer_circle_progression_tt:0 "Albert Speer gains the Reich Architect bonuses while he remains in the Inner Circle. His personal focuses strengthen these bonuses. If removed from the circle, he loses all stages earned through it and returns to his base trait: +5% construction speed and a cost of 0.10 political power per day."
 GER_inner_circle_industrial_me_focuses_tt:0 "(This focus does not block the other Inner Circle industrial branches: §Y$FOCUS_1$§! or §Y$FOCUS_2$§!.)"
 GPW_GER_IC_GORING_1:0 "Four-Year Plan Administrator I"
 GPW_GER_IC_GORING_1_desc:0 "Improves Hermann Göring as a political advisor."
 GPW_GER_IC_GORING_2:0 "Four-Year Plan Administrator II"
 GPW_GER_IC_GORING_2_desc:0 "Improves Hermann Göring as a political advisor."
