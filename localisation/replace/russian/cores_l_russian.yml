 ETH_the_italo-ethiopian_empire_tt: "£victory_point_modifier_texticon  Открывает решения §YИтало-[ETH.GetAdjective]ой империи§! получать национальные территории на захваченной территории.\nОни будут переданы, если в регионе, на который заявлена претензия, или в любом соседнем с ним регионе нет дивизии противника."
 ETH_reclaim_the_empire_tt: "£victory_point_modifier_texticon  Открывает решения §YВозрождение империи§!, позволяющие возвращать себе национальные территории на землях, уступленных государству [ITA.GetFlag][ITA.GetName], как только те снова попадают под [ETH.GetFlag][ETH.GetAdjective]ий контроль."
 SWI_pre_empt_anschluss_tt: "£victory_point_modifier_texticon  §YЕсли [AUS.GetNameDef] примет наше предложение, мы получим национальные территории из числа регионов государства§! \n\nВероятность его согласия зависит от §Yразмера§! нашей армии, его §Yмнения§! о нас и §Yготовности державы [GER.GetNameDef]§! аннексировать государство [AUS.GetName]."
